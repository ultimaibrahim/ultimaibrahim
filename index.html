<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ultima Ibrahim · Portfolio</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
/>

<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body, #root {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #2F2B3F;
    color: #F2F0F8;
    font-family: "Geist", "SF Pro Text", "Inter", system-ui, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-feature-settings: "ss01", "ss02", "cv11";
  }

  /* Premium unification — no italic, single family for display + body.
     Inline fontStyle: 'italic' from the React code is neutralized here so
     the prior serif/italic accents now read as the same Geist family. */
  body, body * { font-style: normal !important; }

  html, body { background: #0B0914; }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="portfolio/favicon.js"></script>
<script src="portfolio/data.js"></script>
<script type="text/babel" src="portfolio/hooks.jsx"></script>
<script type="text/babel" src="portfolio/icons.jsx"></script>
<script type="text/babel" src="portfolio/ui.jsx"></script>
<script type="text/babel" src="portfolio/pages.jsx"></script>
<script type="text/babel" src="portfolio/main.jsx"></script>

<script type="text/babel" data-presets="env,react">
(() => {
  const { useEffect } = React;
  function Root() {
    useEffect(() => {
    }, []);
    return <PortfolioApp />;
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
})();
</script>

</body>
</html>
