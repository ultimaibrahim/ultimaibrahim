<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Proyectos · Ultima Ibrahim</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /* each project keeps its own letterforms: étoile in Giaza (its brand face), mise in a stencil + wide mono (crate and ledger lettering) */
  @font-face { font-family: 'Giaza'; src: url('fonts/Giaza.otf') format('opentype'); font-display: swap; }
  @font-face { font-family: 'Big Shoulders Stencil Display'; src: url('fonts/BigShouldersStencilDisplay.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
  @font-face { font-family: 'Martian Mono'; src: url('fonts/MartianMono.woff2') format('woff2'); font-weight: 100 800; font-stretch: 75% 112.5%; font-display: swap; }
  *, *::before, *::after { box-sizing: border-box; }
  @property --glow { syntax: '<color>'; inherits: true; initial-value: #C084FC; }
  :root {
    --top: 31vh;
    --bg: #0B0914; --ink: #F2F0F8; --ink-2: rgba(242,240,248,.72); --ink-3: rgba(242,240,248,.45);
    --lav: #C084FC; --peri: #B7B9E5; --mint: #9DE3BD; --rose: #E8B5C8;
    --mono: 'Geist Mono', ui-monospace, monospace; --sans: 'Geist', system-ui, sans-serif;
    --ease: cubic-bezier(.2, 1, .3, 1);
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  body::before { content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(circle at 50% 45%, rgba(145,60,220,.22) 0%, rgba(45,18,75,.38) 45%, #0B0914 100%), linear-gradient(180deg, #150F24, #0B0914); }

  /* chrome: plain text, no boxes */
  .bar { position: fixed; z-index: 30; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 20px 24px; font: 500 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); pointer-events: none; }
  .bar > * { pointer-events: auto; }
  .bar.top { top: 0; } .bar.bottom { bottom: 0; padding-bottom: max(20px, env(safe-area-inset-bottom)); }
  @media (pointer: coarse) { .bar a, .bar button { min-height: 44px; display: inline-flex; align-items: center; padding: 0 10px; } .sheet-nav button { padding: 14px 10px; } }
  .bar a, .bar button { color: inherit; text-decoration: none; background: none; border: 0; font: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; padding: 6px 2px; transition: color .2s; }
  .bar a:hover, .bar button:hover, .bar button.on { color: var(--lav); }
  .bar :focus-visible { outline: 1px dashed var(--lav); outline-offset: 3px; }
  .count b { color: var(--ink); font-weight: 600; }
  .hint { opacity: .8; }

  .bar .snd { font-size: 15px; letter-spacing: 0; opacity: .42; padding: 8px; position: relative; } .bar .snd:hover { opacity: .95; } .bar .snd.on { opacity: .6; color: var(--ink-2); }
  .bar .snd:not(.on)::after { content: ''; position: absolute; left: 6px; right: 6px; top: 50%; height: 1px; background: currentColor; transform: rotate(-40deg); }
  /* stage: one continuous ribbon, no boxes; the ends dissolve into glyphs */
  body { transition: --glow .9s ease; }
  .stage { position: fixed; inset: var(--top) 0 0 0; z-index: 2; cursor: grab; touch-action: pan-y; overflow: hidden;
  }
  .edge-fade { position: fixed; z-index: 4; top: var(--top); bottom: 0; width: 15vw; pointer-events: none; }
  .edge-fade.l { left: 0; background: linear-gradient(90deg, #0B0914 8%, transparent); } .edge-fade.r { right: 0; background: linear-gradient(270deg, #0B0914 8%, transparent); }
  .stage.drag { cursor: grabbing; }
  #weave { position: fixed; z-index: 5; inset: var(--top) 0 0 0; width: 100%; height: calc(100% - var(--top)); pointer-events: none; }
  .pn { position: absolute; left: 50%; top: 50%; width: var(--cw); height: var(--ch); margin: calc(var(--ch) * -.5) 0 0 calc(var(--cw) * -.5);
    display: flex; flex-direction: column; justify-content: space-between; padding: clamp(18px, 2.4vw, 30px) clamp(30px, 4.4vw, 58px); will-change: transform; user-select: none; -webkit-user-select: none; outline: none;
    background: linear-gradient(180deg, #0B0914 0%, transparent 14%, transparent 86%, #0B0914 100%), radial-gradient(90% 130% at 50% 0%, color-mix(in srgb, var(--acc) 22%, transparent), transparent 72%), linear-gradient(90deg, transparent, rgba(24,18,42,.9) 9%, rgba(16,11,30,.9) 91%, transparent); }
  .pn:focus-visible .pn-name { text-decoration: underline dashed var(--acc); text-underline-offset: 8px; }
  .pn-top { display: flex; justify-content: space-between; gap: 12px; font: 500 11px var(--mono); letter-spacing: .14em; color: var(--ink-3); text-transform: uppercase; }
  .pn-top .st { color: var(--acc); text-align: right; }
  .pn-name { margin: 0; font-weight: 600; font-size: clamp(36px, 4.6vw, 76px); letter-spacing: -.045em; line-height: .95; }
  .pn[data-k="0"] .pn-name, .sheet[data-id="etoile"] h2 { font-family: 'Giaza', Georgia, serif; font-weight: 400; letter-spacing: .005em; }
  .pn[data-k="1"] .pn-name, .sheet[data-id="mise"] h2 { font-family: 'Big Shoulders Stencil Display', Impact, sans-serif; font-weight: 900; letter-spacing: .01em; line-height: .85; }
  .pn[data-k="1"] .pn-name { font-size: clamp(64px, 8vw, 128px); } .sheet[data-id="mise"] h2 { font-size: clamp(100px, 18vw, 290px); }
  .pn[data-k="1"], .sheet[data-id="mise"] { --mono: 'Martian Mono', ui-monospace, monospace; } .pn[data-k="1"] .rw { font-size: 11px; } .sheet[data-id="mise"] .cols p, .sheet[data-id="mise"] .now { font-size: 12.5px; }
  .sheet[data-id="mise"] .flow span { font: 900 15px 'Big Shoulders Stencil Display', Impact, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
  .pn-top svg { width: 13px; height: 13px; vertical-align: -2px; margin-right: 6px; }
  .pn-tag { margin: 6px 0 0; font-size: clamp(12px, 1vw, 14px); line-height: 1.4; color: var(--ink-2); max-width: 52ch; }
  .pn-body { min-height: 0; }
  .pn-lab { font: 500 10.5px var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--acc); margin-bottom: 6px; }
  .pn-rows { display: grid; gap: 3px; }
  .rw { display: flex; gap: 14px; font: 400 12.5px/1.45 var(--mono); }
  .rw span { flex: 0 0 78px; color: var(--acc); } .rw span.m { flex-basis: 12px; }
  .rw b { font-weight: 400; color: var(--ink-2); min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .pn-dots { display: flex; gap: 6px; } .pn-dots i { width: 16px; height: 2px; background: rgba(242,240,248,.2); transition: background .3s, width .3s; } .pn-dots i.on { background: var(--acc); width: 28px; }

  /* identity: always on the main screen, fetch-style, no boxes */
  .me { position: fixed; z-index: 6; left: clamp(24px, 7vw, 120px); right: clamp(24px, 7vw, 120px); top: 58px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 8px 6vw; align-items: end; pointer-events: none; }
  .me a { pointer-events: auto; }
  .me-k { margin: 0 0 8px; font: 500 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
  .me h1 { margin: 0; font-weight: 600; font-size: clamp(38px, 5.6vw, 92px); letter-spacing: -.05em; line-height: .92; }
  .me-role { margin: 8px 0 0; font: 400 clamp(12px, 1.1vw, 15px) var(--mono); color: var(--glow); transition: color .6s; }
  .me-r { display: grid; gap: 5px; font: 400 clamp(11.5px, .95vw, 13px)/1.45 var(--mono); }
  .me-r div { display: flex; gap: 14px; }
  .me-r span { flex: 0 0 82px; color: var(--glow); transition: color .6s; }
  .me-r b { font-weight: 400; color: var(--ink-2); min-width: 0; overflow-wrap: anywhere; }
  .me-r a { color: var(--ink); text-decoration: none; border-bottom: 1px dashed var(--ink-3); margin-right: 12px; transition: color .2s, border-color .2s; }
  .me-r a:hover { color: var(--glow); border-color: var(--glow); }

  /* glow rising from below, tinted by the card in front */
  .glow { position: fixed; z-index: 1; left: 0; right: 0; bottom: 0; height: 70vh; pointer-events: none;
    background: radial-gradient(60% 90% at 50% 108%, color-mix(in srgb, var(--glow) 95%, #fff 5%) 0%, color-mix(in srgb, var(--glow) 48%, transparent) 30%, transparent 70%), radial-gradient(110% 60% at 50% 125%, color-mix(in srgb, var(--glow) 70%, transparent), transparent 70%); animation: breathe 6s ease-in-out infinite; }
  .glow::after { content: ''; position: absolute; left: 12%; right: 12%; bottom: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--glow), transparent); filter: blur(1px); opacity: .9; }
  @keyframes breathe { 0%, 100% { opacity: .82; transform: scaleY(.96); } 50% { opacity: 1; transform: scaleY(1.04); } }
  #sparks { position: fixed; z-index: 1; left: 0; right: 0; bottom: 0; width: 100%; height: 62vh; pointer-events: none; }
  #arrive { position: fixed; inset: 0; z-index: 99; pointer-events: none; }

  /* sheet (opened project) */
  .sheet { position: fixed; z-index: 40; overflow: hidden; background: radial-gradient(120% 80% at 15% 0%, color-mix(in srgb, var(--acc) 26%, transparent), transparent 60%), linear-gradient(165deg, #1b1430, #0d0919); }
  .sheet-body { position: absolute; inset: 0; overflow-y: auto; padding: 84px clamp(20px, 6vw, 96px) 120px; opacity: 0; transition: opacity .35s .25s; }
  .sheet.in .sheet-body { opacity: 1; }
  .sheet h2 { margin: 0 0 8px; font-size: clamp(48px, 9vw, 150px); font-weight: 600; letter-spacing: -.05em; line-height: .92; }
  .sheet .lede { margin: 0 0 38px; max-width: 46ch; color: var(--ink-2); font-size: clamp(15px, 1.4vw, 19px); line-height: 1.5; }
  .cols { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 40px 64px; max-width: 1200px; }
  .cols h3 { margin: 0 0 12px; font: 500 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--acc); }
  .cols p, .cols li { color: var(--ink-2); line-height: 1.6; font-size: 15px; max-width: 60ch; }
  .cols ul { margin: 0; padding: 0; list-style: none; } .cols li { padding: 7px 0 7px 18px; position: relative; } .cols li::before { content: '›'; position: absolute; left: 0; color: var(--acc); }
  .stack { font: 400 12px var(--mono); color: var(--ink-3); display: flex; flex-wrap: wrap; gap: 8px 16px; }
  .link { display: inline-block; margin-top: 22px; color: var(--ink); font: 500 13px var(--mono); text-decoration: none; border-bottom: 1.5px dashed var(--acc); padding-bottom: 3px; }
  .link:hover { color: var(--acc); }
  .sheet-nav { position: absolute; z-index: 2; left: 0; right: 0; display: flex; justify-content: space-between; padding: 20px 24px; font: 500 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); opacity: 0; transition: opacity .3s .3s; }
  .sheet.in .sheet-nav { opacity: 1; } .sheet-nav.t { top: 0; } .sheet-nav.b { bottom: 0; padding-bottom: max(20px, env(safe-area-inset-bottom)); background: linear-gradient(0deg, #0d0919 40%, transparent); }
  .sheet-nav button { background: none; border: 0; color: inherit; font: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; padding: 6px 2px; transition: color .2s; }
  .sheet-nav button:hover { color: var(--acc); } .sheet-nav :focus-visible { outline: 1px dashed var(--acc); outline-offset: 3px; }

  .sheet .sig { position: absolute; right: -9vw; bottom: -14vh; width: min(86vh, 72vw); fill: var(--acc); color: var(--acc); opacity: .06; pointer-events: none; }
  .sheet .edge { position: absolute; left: 10px; top: 72px; bottom: 72px; width: 14px; overflow: hidden; text-align: center; white-space: pre; font: 400 11px/16px var(--mono); color: var(--acc); opacity: .3; pointer-events: none;
    -webkit-mask-image: linear-gradient(transparent, #000 15%, #000 85%, transparent); mask-image: linear-gradient(transparent, #000 15%, #000 85%, transparent); }
  .vis { position: absolute; top: 84px; right: clamp(20px, 6vw, 96px); width: min(44vw, 620px); }
  .vis:empty { display: none; } .vis[data-id="signo"] { width: min(34vw, 500px); top: 96px; }
  .sg { display: grid; gap: 8px; }
  .sg .tk { display: grid; grid-template-columns: 38px 1fr auto; align-items: center; gap: 12px; padding: 9px 12px; border: 1px solid rgba(255,255,255,.09); border-radius: 12px; background: rgba(20,14,36,.55); animation: tkIn .5s cubic-bezier(.2,1,.3,1) both; }
  .sg .tk canvas { width: 38px; height: 38px; image-rendering: pixelated; }
  .sg .tk b { display: block; font: 500 10.5px var(--mono); letter-spacing: .1em; color: var(--ink-3); font-weight: 500; }
  .sg .tk span.t { display: block; font-size: 13.5px; color: var(--ink); line-height: 1.3; }
  .sg .tk em { font: 500 10px var(--mono); letter-spacing: .08em; text-transform: uppercase; font-style: normal; padding: 3px 8px; border-radius: 999px; color: var(--c); border: 1px solid var(--c); transition: color .4s, border-color .4s, background .4s; }
  .sg .tk.res { opacity: .62; }
  @keyframes tkIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
  .vis canvas { display: block; width: 100%; height: min(42vh, 360px); }
  .vis-cap { margin-top: 8px; font: 400 11px var(--mono); letter-spacing: .08em; color: var(--ink-3); }
  /* SIGNO: the wordmark cut into horizontal bands, each letter painted as it is crossed */
  .sw { display: flex; margin: 0 0 12px; font-size: clamp(64px, 14vw, 230px) !important; font-weight: 700 !important; letter-spacing: -.05em; line-height: .9; }
  .sw span { color: transparent; -webkit-text-stroke: 1.5px color-mix(in srgb, var(--lc) 50%, transparent); transition: color .25s, -webkit-text-stroke-color .25s; cursor: crosshair; padding-right: .02em;
    -webkit-mask-image: repeating-linear-gradient(180deg, #000 0 15%, transparent 15% 18.5%); mask-image: repeating-linear-gradient(180deg, #000 0 15%, transparent 15% 18.5%); }
  .sw span.on { color: var(--lc); -webkit-text-stroke-color: var(--lc); }
  .pn[data-k="2"] .pn-name { -webkit-mask-image: repeating-linear-gradient(180deg, #000 0 15%, transparent 15% 18.5%); mask-image: repeating-linear-gradient(180deg, #000 0 15%, transparent 15% 18.5%); }
  /* mise: the kardex exactly as a spreadsheet draws it */
  .xl { background: #fff; color: #202124; border-radius: 8px; overflow: hidden; box-shadow: 0 24px 60px -24px rgba(0,0,0,.7); font: 12px/20px Arial, 'Helvetica Neue', sans-serif; }
  .xl-bar { display: flex; align-items: center; gap: 10px; padding: 5px 10px; border-bottom: 1px solid #e1e3e6; background: #fff; }
  .xl-bar .nm { font-weight: 600; color: #202124; padding-right: 10px; border-right: 1px solid #e1e3e6; } .xl-bar .fx { color: #80868b; font-style: italic; font-family: serif; } .xl-bar .fv { font-family: 'Roboto Mono', ui-monospace, monospace; color: #202124; }
  .xl table { border-collapse: collapse; width: 100%; table-layout: fixed; } .xl th, .xl td { border: 1px solid #e1e3e6; padding: 0 6px; height: 21px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; font-weight: 400; }
  .xl thead th, .xl tbody th { background: #f8f9fa; color: #5f6368; text-align: center; font-size: 11px; } .xl tbody th { width: 28px; padding: 0; } .xl thead th:first-child { width: 28px; }
  .xl td.n { text-align: right; } .xl tr.hd td { font-weight: 700; background: #f8f9fa; } .xl td.cur { outline: 2px solid #1a73e8; outline-offset: -2px; } .xl tr.fl td { background: #e6f4ea; transition: background .6s; }
  .flow { display: flex; align-items: center; gap: 10px; margin-top: 12px; font: 500 11px var(--mono); color: var(--ink-2); } .flow span { padding: 3px 8px; border: 1px dashed color-mix(in srgb, var(--acc) 60%, transparent); color: var(--acc); }
  .flow i { position: relative; flex: 0 0 70px; height: 1px; background: color-mix(in srgb, var(--acc) 40%, transparent); } .flow i::after { content: ''; position: absolute; top: -2px; left: 0; width: 5px; height: 5px; border-radius: 50%; background: var(--acc); animation: hop 1.8s linear infinite; }
  @keyframes hop { from { left: 0; opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } to { left: 100%; opacity: 0; } } .flow em { font-style: normal; color: var(--ink-3); margin-left: 6px; }
  .now { display: grid; gap: 6px; margin: 0 0 30px; font: 400 13px/1.5 var(--mono); max-width: 70ch; }
  .now div { display: flex; gap: 16px; } .now span { flex: 0 0 96px; color: var(--acc); } .now b { font-weight: 400; color: var(--ink-2); }
  .stage.compact .pn-tag, .stage.compact .pn-dots { display: none; } .stage.compact .rw { font-size: 10.5px; line-height: 1.35; } .stage.compact .pn-name { font-size: clamp(34px, 9vw, 52px); } .stage.compact .pn[data-k="1"] .pn-name { font-size: clamp(44px, 12vw, 70px); } .stage.compact .pn { padding-top: 14px; padding-bottom: 12px; }
  @media (max-height: 700px) and (max-width: 800px) { .me-r div:nth-child(3) { display: none; } .me h1 { font-size: 36px; } }
  @media (max-width: 800px) { .edge-fade { width: 7vw; } }
  @media (max-width: 800px) {
    :root { --top: 39vh; }
    .me { grid-template-columns: 1fr; top: 54px; gap: 12px; }
    .me-r { gap: 3px; font-size: 11.5px; } .me-r div:first-child { display: none; } .me-r span { flex-basis: 66px; }
    .me-r b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .rw { font-size: 11.5px; gap: 10px; } .rw span { flex-basis: 64px; }
    .cols { grid-template-columns: 1fr; }
    .hint { display: none; }
    .now div { flex-direction: column; gap: 0; } .now span { flex: none; }
    .vis[data-id="signo"] { width: 100%; top: 0; } .vis { position: relative; top: 0; right: 0; width: 100%; margin-bottom: 22px; } .vis canvas { height: 240px; } .sheet .edge { display: none; } .flow em { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .sheet-body, .sheet-nav { transition: none; } .glow { animation: none; } }
</style>
</head>
<body>

<div class="bar top">
  <a href="gateway.html" id="back" title="Volver a la terminal">← terminal</a>
  <button id="snd" class="snd" aria-pressed="false" title="Silenciar">♪</button>
</div>

<div class="glow" aria-hidden="true"></div>
<canvas id="sparks" aria-hidden="true"></canvas>

<section class="me" id="me" aria-label="Sobre mí">
  <div>
    <p class="me-k">ultimaibrahim · Guadalajara, MX</p>
    <h1>Ibrahim García</h1>
    <p class="me-role">Data Product Developer</p>
  </div>
  <div class="me-r" id="me-r"></div>
</section>

<main class="stage" id="stage" aria-label="Proyectos"></main>
<canvas id="weave" aria-hidden="true"></canvas>
<i class="edge-fade l"></i><i class="edge-fade r"></i>
<div id="arrive" style="position:fixed;inset:0;z-index:99;background:#0B0914"></div>

<div class="bar bottom">
  <span class="count"><b id="cur">01</b> / <span id="tot">03</span> · <span id="curName"></span></span>
  <span class="hint">fluye solo · arrastra o gira la rueda</span>
</div>

<script src="favicon.js"></script>
<script src="data.js"></script>
<script>
(() => {
  const D = window.PortfolioData, P = D.PROFILE, L = 'es';
  const tx = v => (v && typeof v === 'object') ? (v[L] || v.es) : v;
  const proj = id => D.PROJECTS.find(p => p.id === id);

  // ── content: the three products, with their current state ──
  const ACC = { etoile: '#C084FC', mise: '#9DE3BD', signo: '#F2B8D8' };
  const CARDS = ['etoile', 'mise', 'signo'].map((id, i) => {
    const p = proj(id), now = p.now || [];
    return { id, acc: ACC[id], idx: String(i + 1).padStart(2, '0'), top: 'Proyecto', st: now.length ? now[0][1].split(' · ').slice(0, 2).join(' · ') : tx(p.status), name: tx(p.name),
      tag: tx(p.tagline).split(' · ')[0], tags: p.stack.slice(0, 3), now,
      lede: tx(p.summary), bullets: p.bullets[L] || p.bullets.es, stack: p.stack,
      arch: p.architecture && [['Topología', tx(p.architecture.topology)], ['Pipeline', tx(p.architecture.pipeline)]], link: p.siteUrl || p.repoUrl, linkText: p.siteUrl ? 'Abrir ' + p.siteUrl.replace('https://', '') + ' ↗' : 'Ver repositorio ↗' };
  });

  // ── identity block: the "about me" that used to hide behind a card ──
  const ab = D.ABOUT[L];
  document.getElementById('me-r').innerHTML = [
    ['Obsesión', 'Que la información que ya existe no se pierda'],
    ['Estudia', 'Ciencia de Datos e Inteligencia Artificial'],
    ['Stack', 'Python · R · Apps Script V8 · Node · Supabase · PostgreSQL · Netlify'],
    ['Contacto', `<a href="mailto:${P.email}">correo</a><a href="https://${P.github}" target="_blank" rel="noopener">GitHub</a><a href="https://${P.linkedin}" target="_blank" rel="noopener">LinkedIn</a>`],
  ].map(([k, v]) => `<div><span>${k}</span><b>${v}</b></div>`).join('');
  document.getElementById('back').addEventListener('click', e => { if (window.parent !== window) { e.preventDefault(); parent.postMessage({ type: 'portfolio:back' }, location.origin); } });
  const n = CARDS.length;
  document.getElementById('tot').textContent = String(n).padStart(2, '0');

  // ── sound: synthesized, opt-in, shares the gateway's preference ──
  const sfx = (() => {
    let ctx, master, bed, on = false;

  const SG_TYPES = [['ojo', '#d55181', 'Revisar el cierre de la semana'], ['grieta', '#e66767', 'Falla al subir el archivo'], ['corona', '#9085e9', 'Aprobar el cambio de turno'], ['chispa', '#3987e5', 'Idea: filtro por sucursal'], ['orbita', '#c98500', 'Conciliar saldos del mes']];

  function drawSigil(cv, d, color, res) {

  function pixelate(cv, d, color) { const steps = [4, 6, 9, 14, 22, 40, 76]; steps.forEach((r, i) => setTimeout(() => { if (cv.isConnected) drawSigil(cv, d, color, r); }, i * 70)); }
  function signoVis(root, host) {

  function etoileVis(host, acc) {                // 33 branches grouped by region, traced as a constellation around the star; a pulse travels region by region

    let hov = -1, mx = -1, my = -1; const L = 'ABCDE';

      hov = -1; if (mx >= 0) { let bd = 18; nodes.forEach(nd => { const [x, y] = P(nd), d = Math.hypot(x - mx, y - my); if (d < bd) { bd = d; hov = nd.grp; } }); }

        const lit = hov === b.grp || hov === a.grp; g.strokeStyle = acc; g.globalAlpha = lit ? .8 : .3 + .35 * Math.exp(-Math.pow((dist.get(b) || 0) - pr, 2) * 2); g.lineWidth = lit ? 1.4 : 1;
        g.beginPath(); g.moveTo(x1, y1); g.lineTo(x1 + (x2 - x1) * p, y1 + (y2 - y1) * p); g.stroke(); });
      nodes.forEach((nd, i) => { const gi = nd.grp, appear = Math.min(1, Math.max(0, (T - gi * .5 - .3) / .4)); if (appear <= 0) return; const [x, y] = P(nd);
        const glow = Math.exp(-Math.pow((dist.get(nd) || 0) - pr, 2) * 2), lit = hov === gi, tw = .6 + .4 * Math.sin(T * 2 + nd.ph);
        g.globalAlpha = (lit ? 1 : .55 + .45 * glow) * appear * tw; g.fillStyle = (glow > .6 || lit) ? '#fff' : acc; g.beginPath(); g.arc(x, y, (nd.hub ? 4 : 2.4) * (1 + glow * .5), 0, 6.283); g.fill(); });

  }
  function miseVis(host) {                       // the kardex as it looks in Google Sheets, filling itself in; below, the hub-and-spoke sync

      const prev = saldo[name] || 20 + k * 3, s = Math.max(0, prev + inn - out); saldo[name] = s;
      rowsD.push({ r: rn++, f: '17/10', i: name + ' (' + u + ')', e: inn || '', s: out || '', t: s, d: inn ? 'BDG' : 'PDA' }); if (rowsD.length > 8) rowsD.shift(); };

      grid.innerHTML = '<table><thead><tr><th></th>' + 'ABCDEF'.split('').map(c => `<th>${c}</th>`).join('') + '</tr></thead><tbody><tr class="hd"><th>1</th>' + ['Fecha', 'Insumo', 'Entrada', 'Salida', 'Saldo', 'Destino'].map(c => `<td>${c}</td>`).join('') + '</tr>'
        + rowsD.map(x => `<tr class="${x === last && flash ? 'fl' : ''}"><th>${x.r}</th><td>${x.f}</td><td>${x.i}</td><td class="n">${x.e}</td><td class="n">${x.s}</td><td class="n sel${x === last ? ' cur' : ''}">${x.t}</td><td>${x.d}</td></tr>`).join('') + '</tbody></table>';
      fv.textContent = `=E${last.r - 1}+C${last.r}-D${last.r}`; };

    const iv = setInterval(() => { add(); flash = true; draw(); setTimeout(() => { flash = false; draw(); }, 700); }, 1900);
    return () => clearInterval(iv);

  let sheet = null, origEl = null, origK = -1, visClean = () => {}, closing = false, glide = null;
  function mountSheetVis(k) { visClean(); const root = sheet, host = root.querySelector('.vis'), c = CARDS[k];
    visClean = c.id === 'signo' ? (() => { const a = signoWord(root), b = signoVis(root, host); return () => { a(); b(); }; })() : c.id === 'etoile' ? etoileVis(host, c.acc) : c.id === 'mise' ? miseVis(host) : () => {}; }
  const glideBy = (dx, ms) => new Promise(res => { glide = { a: S, b: S + dx, t: 0, d: ms / 1000, res }; });

  function open(k, el) {
    if (opened !== null || !el || closing) return; opened = k; origEl = el; origK = k; sfx.open();
    const r = el.getBoundingClientRect(), c = CARDS[k];
    sheet = document.createElement('section'); sheet.className = 'sheet'; sheet.dataset.id = c.id; sheet.style.setProperty('--acc', c.acc); sheet.setAttribute('role', 'dialog'); sheet.setAttribute('aria-label', c.name);
    Object.assign(sheet.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px', borderRadius: '20px' });
    sheet.innerHTML = sheetHTML(c); document.body.appendChild(sheet); mountSheetVis(k);
    sheet.addEventListener('click', e => { const a = e.target.closest('[data-a]'); if (!a) return; if (a.dataset.a === 'close') close(); else step(a.dataset.a === 'next' ? 1 : -1); });
    const to = { left: '0px', top: '0px', width: innerWidth + 'px', height: innerHeight + 'px', borderRadius: '0px' };
    sheet.animate([{ opacity: 0 }, { opacity: 1 }], { duration: reduce ? 1 : 240, fill: 'both' });
    const a = sheet.animate([{ left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px', borderRadius: '20px' }, to], { duration: reduce ? 1 : 620, easing: 'cubic-bezier(.2,1,.3,1)', fill: 'forwards' });
    a.onfinish = () => { Object.assign(sheet.style, to); a.cancel(); sheet.style.width = '100vw'; sheet.style.height = '100dvh'; };
    el.style.transition = 'none'; el.style.opacity = '0';
    sheet.classList.add('in'); sheet.querySelector('[data-a="close"]').focus({ preventScroll: true });
    document.querySelector('.bar.bottom').style.opacity = '0'; stage.style.pointerEvents = 'none';
  }
  function step(dir) {
    if (opened === null || !sheet || closing) return; const k = mod(opened + dir, n); sfx.change();
    if (origEl) { origEl.style.opacity = ''; origEl = null; }
    const body = sheet.querySelector('.sheet-body'); body.style.transition = 'opacity .18s'; body.style.opacity = '0';
    setTimeout(() => { opened = k; const c = CARDS[k]; sheet.dataset.id = c.id; sheet.style.setProperty('--acc', c.acc); visClean(); sheet.innerHTML = sheetHTML(c); mountSheetVis(k); const nb = sheet.querySelector('.sheet-body'); nb.style.transition = 'opacity .3s'; nb.style.opacity = '1'; sheet.querySelectorAll('.sheet-nav').forEach(x => { x.style.opacity = '1'; x.style.transition = 'none'; }); }, 190);
  }
  async function close() {
    if (opened === null || !sheet || closing) return; closing = true; sfx.close(); visClean(); visClean = () => {};
    let el = (opened === origK && origEl && origEl.isConnected) ? origEl : null;       // normally it goes back exactly where it came from
    if (!el) {                                                                           // it moved to another project: bring that one into view first, smoothly
      let best = 0, bx = 1e9; for (let j = 0; j < N; j++) { if (j % n !== opened) continue; const x = mod(j * pitch - S + total / 2, total) - total / 2; if (Math.abs(x) < Math.abs(bx)) { bx = x; best = j; } }
      if (Math.abs(bx) > innerWidth * .22) await glideBy(bx, 700);
